", "size": 15, "title": "\u003cb\u003eDevi Lal\u003c/b\u003e\u003cbr\u003eType: Person\u003cbr\u003eBetweenness Centrality: 0.0\u003cbr\u003eDegree: 2\u003cbr\u003e"}]);

};
